function addParkingRuns(days){const pk=by(S.places,S.set.parking);if(!pk){toast("Choose a parking space in Setup first.");return 0}let n=0;

 if(a==="undo"){const j=undoStack.pop();if(j){S=JSON.parse(j);fixSet();selId="";toast("Restored.")}}
 if(a==="add-park-day"){addParkingRuns([curDay])}
 if(a==="add-park-all"){addParkingRuns(Array.from({length:S.set.days},(_,i)=>i))}
 if(a==="qtog"){const t2=by(S.trips,selId),arr=t2[t.dataset.f],i=arr.indexOf(id);i<0?arr.push(id):arr.splice(i,1)}
 if(a==="copy-tab"){copyTab(t.dataset.tab);return}
 if(a==="export-xlsx"){exportXlsx();return}
 if(a==="export-plan"){exportPlan();return}
 if(a==="export-csv"){exportCsv();return}
 if(a==="sync-sheet"){syncSheet(true);return}
 if(a==="zoom-in"){zoomBy(1);return}
 if(a==="zoom-out"){zoomBy(-1);return}
 if(a==="geocode"){geocode(id);return}
 if(a==="pick"){pick=id;setupOpen=false;render();toast("Tap the map to place it.");return}
 if(a==="cancel-pick"){pick="";setupOpen=true;render();return}
 if(a==="tog-map"){const p=by(S.places,id);p.hide=!p.hide}
 if(a==="add-place"){const n=v("p-name").value.trim();if(!n){v("p-name").focus();return}
  const p={id:uid(),name:n,kind:v("p-kind").value,addr:v("p-addr").value.trim(),flex:v("p-flex").checked},par=v("p-parent").value,raw=v("p-ll").value.trim(),c=parseLL(raw);
  if(raw&&!c){toast("Coordinates should look like 59.35, 18.07.");return}if(par)p.parent=par;if(c){p.lat=c[0];p.lng=c[1]}if(p.flex){p.info="Park anywhere. Parking is refunded.";p.addr=""}S.places.push(p);if(p.addr&&!c&&!p.flex)geocode(p.id)}
 if(a==="find-place"){const q=(v("p-addr").value||v("p-name").value).trim();if(q)window.open("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q),"_blank","noopener");return}
 if(a==="del-place"){if(!ask("p"+id,"Remove this place, its subplaces and their trips?"))return;
  const ids=S.places.filter(p=>p.id===id||p.parent===id).map(p=>p.id);S.places=S.places.filter(p=>!ids.includes(p.id));S.trips=S.trips.filter(x=>!ids.includes(x.from)&&!ids.includes(x.to));S.cars.forEach(x=>{if(ids.includes(x.from))x.from=""})}

 if(a==="add-car"){const nm=v("v-name").value.trim();if(!nm){toast("Enter a car name.");return}const car={id:uid(),name:nm,seats:3,cargo:0,from:v("v-from").value};S.cars.push(car);const k=fillCars();toast(k?`${nm} was added to all ${k} runs.`:"Car added.")}
 if(a==="fill-cars"){const k=fillCars();toast(k?`Added ${k} car trip${k>1?"s":""} so every run has every car.`:"Every run already has every car.")}
 if(a==="add-zone"){const pl=by(S.places,id);pl.zones=(pl.zones||[]).concat({id:uid(),name:"New zone",use:"both",note:""})}
 if(a==="del-zone"){const pl=by(S.places,id);pl.zones=(pl.zones||[]).filter(z=>z.id!==t.dataset.zid)}
 if(a==="del-car"){if(!ask("c"+id,"Remove this car and its trips?"))return;S.cars=S.cars.filter(x=>x.id!==id);S.trips=S.trips.filter(x=>x.car!==id)}
 if(a==="add-person"){const n=v("n-person").value.trim();if(!n)return;S.people.push({id:uid(),name:n})}
 if(a==="del-person"){S.people=S.people.filter(x=>x.id!==id);S.trips.forEach(x=>{if(x.driver===id)x.driver="";["pack","unpack","riders"].forEach(k=>x[k]=x[k].filter(i=>i!==id))})}
 if(a==="add-note"){const at=new Date(v("nt-at").value).getTime(),tx=v("nt-text").value.trim();if(!tx||isNaN(at)){toast("Enter a time and a note.");return}S.notes.push({id:uid(),at,text:tx,place:v("nt-place").value})}
 if(a==="del-note"){S.notes=S.notes.filter(n=>n.id!==id)}
 if(a==="clear-example"){if(!ask("clr","Remove all trips and notes?"))return;S.trips=[];S.notes=[];selId=""}
 if(a==="restore"){if(!ask("rst","Replace everything with the Nov 12 to 15 plan?"))return;S=sample();draft=null;selId=""}
 save();render()});
document.addEventListener("change",e=>{
 const t=e.target,id=t.id,d=t.dataset;
 if(id==="plan-file"){const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.places||!o.trips)throw 0;S=o;fixSet();save();render();toast("Plan loaded.")}catch(x){toast("That file isn’t a plan.json from this app.")}};r.readAsText(f);return}
 if(id==="s-park"){S.set.parking=t.value;save();render();return}
 if(id==="s-parkwait"){S.set.parkWait=Math.max(0,parseInt(t.value)||0);save();render();return}
 if(id==="s-sheet"){S.set.sheet=t.value.trim();save();if(S.set.sheet)syncSheet(true);return}
 if(id==="s-pack"||id==="s-unpack"){S.set.packSlots=Math.max(0,parseInt($("s-pack").value)||0);S.set.unpackSlots=Math.max(0,parseInt($("s-unpack").value)||0);save();render();return}
 if(id==="s-tiles"||id==="s-tilesrc"){if(id==="s-tiles")S.set.tiles=t.value.trim();else S.set.tileSrc=t.value;for(const k in TILES){TILES[k].remove();delete TILES[k]}srcStart=0;tilesErr=0;tileWarned=false;save();render();return}
 if(id==="s-traffic"){S.set.traffic=Math.max(1,+t.value||1.25);save();render();return}
 if(id==="s-speed"||id==="s-factor"){S.set.speed=Math.max(5,+$("s-speed").value||35);S.set.factor=Math.max(1,+$("s-factor").value||1.3);save();render();return}
 if(id==="s-unit"){S.set.unit=t.value.trim()||"m³";save();render();return}
 if(id==="s-start"){const x=new Date(t.value+"T00:00");if(!isNaN(x))S.set.start=x.getTime();save();render();return}
 if(id==="s-days"){S.set.days=Math.min(10,Math.max(1,parseInt(t.value)||4));save();render();return}
 if(id==="s-hour"){S.set.dayHour=Math.min(12,Math.max(0,parseInt(t.value)||0));save();render();return}
 if(d.car){by(S.cars,d.car)[d.vf]=Math.max(0,parseFloat(t.value)||0);save();render();return}
 if(d.pi){by(S.places,d.pi).info=t.value;save();return}
 if(d.cn){const c=by(S.cars,d.cn),nm=t.value.trim();if(nm){c.name=nm;save();render()}else t.value=c.name;return}
 if(d.cs){by(S.cars,d.cs).seats=Math.max(0,parseInt(t.value)||0);save();render();return}
 if(d.cc){by(S.cars,d.cc).capacity=t.value.trim();save();render();return}
 if(d.zp){const pl=by(S.places,d.zp),z=(pl.zones||[]).find(x=>x.id===d.zid);if(z){if(d.zf==="name"){const s=t.value.trim();if(s)z.name=s;else t.value=z.name}else z[d.zf]=t.value;save();render()}return}
 if(d.cf){by(S.cars,d.cf).from=t.value;save();render();return}
 if(d.nt){const n=by(S.notes,d.nt);if(!n)return;if(d.nf==="at"){const v=new Date(t.value).getTime();if(v)n.at=v}else if(d.nf==="text"){const s=t.value.trim();if(s)n.text=s;else t.value=n.text}else n.place=t.value;save();render();return}
 if(d.pn){const p=by(S.places,d.pn),nm=t.value.trim();if(nm){p.name=nm;save();render()}else t.value=p.name;return}
 if(d.pk){by(S.places,d.pk).kind=t.value;save();render();return}
 if(d.pa){by(S.places,d.pa).addr=t.value.trim();save();return}
 if(d.pl){const p=by(S.places,d.pl),raw=t.value.trim(),c=parseLL(raw);if(!raw){delete p.lat;delete p.lng}else if(c){p.lat=c[0];p.lng=c[1]}else{toast("Coordinates should look like 59.35, 18.07.");render();return}save();render();return}
 if(d.q==="standin"){const t2=by(S.trips,selId);if(t2){runIdsOf(t2).forEach(i=>{by(S.trips,i).standin=t.value});save();render()}return}
 if(d.q){const t2=by(S.trips,selId);if(t2){t2[d.q]=d.q==="load"?Math.max(0,parseFloat(t.value)||0):t.value;save();render()}return}
 const f=d.f;if(!f||!draft)return;const val=t.value;
 if(f==="tval"){const v=new Date(val).getTime();if(v){if(draft.mode==="arr")draft.arrAt=v;else draft.dep=v}render();return}
 if(f==="mode"){if(val==="arr"&&draft.mode!=="arr")draft.arrAt=draft.dep+estT(draft)*M;if(val==="dep"&&draft.mode==="arr")draft.dep=draft.arrAt-estT(draft)*M;draft.mode=val;render();return}
 draft[f]=f==="dep"?(new Date(val).getTime()||draft.dep):(f==="packMin"||f==="unpackMin"||f==="min")?Math.max(0,parseInt(val)||0):f==="load"?Math.max(0,parseFloat(val)||0):val;
 if(["car","from","to","dep","min","load","driver"].includes(f))render()});
(function(){S.trips.forEach(t=>{delete t.park});delete S.set.parkOff;const hasLL=p=>typeof p.lat==="number",v=S.places.find(p=>p.name==="Viking Terminalen"&&(!p.addr||/Stadsgårdskajen/.test(p.addr)));
 if(v){v.addr="Terminalen Stadsgården, Tegelvikshamn, 116 45 Stockholm";v.lat=59.3151;v.lng=18.0959}
 const m=S.places.find(p=>p.name==="MF (storage and concert)");if(m){m.name="MF (Medicinska Föreningen)";if(!m.addr)m.addr="Nobels väg 10, 171 65 Solna";if(!hasLL(m)){m.lat=59.35;m.lng=18.0262}}
 let dp=S.places.find(p=>p.name==="Datasektionen parking");if(!dp){dp={id:uid(),name:"Datasektionen parking",kind:"Parking",addr:"Position to be determined"};S.places.push(dp)}
 if(S.set.parking===undefined)S.set.parking=dp.id;
 if(hadLocal)save()})();
render();
if(EDIT){$("banner").hidden=false;$("banner").textContent="Edit mode: your changes stay in this browser. To publish them, download plan.json from Setup and commit it next to this page."}
(async()=>{let plan=null;try{const r=await fetch("plan.json",{cache:"no-store"});if(r.ok)plan=await r.json()}catch(e){}
 if(plan&&plan.places&&plan.trips&&(!EDIT||!hadLocal)){S=plan;fixSet();selId="";curDay=0;save();render()}
 if(S.set.sheet)syncSheet(false)})();
setInterval(()=>{if(S.set.sheet&&!document.hidden&&!draft&&!setupOpen)syncSheet(false)},12e4);
</script>
